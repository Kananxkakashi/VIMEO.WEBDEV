<main id="main"><section><h2>Contact Us</h2>
<div class="form-wrap">
<!-- Replace the action URL with your own endpoint (e.g. Formspree) -->
<form action="https://formspree.io/f/your-form-id" method="POST" data-ajax novalidate>
  <div class="field"><label for="name">Full name</label>
    <input id="name" name="name" type="text" required minlength="2" maxlength="50" autocomplete="name">
    <span class="error" aria-live="polite"></span></div>
  <div class="field"><label for="email">Email</label>
    <input id="email" name="email" type="email" required autocomplete="email">
    <span class="error" aria-live="polite"></span></div>
  <div class="field"><label for="phone">Phone (optional)</label>
    <input id="phone" name="phone" type="tel" inputmode="tel" placeholder="082 123 4567" autocomplete="tel">
    <span class="error" aria-live="polite"></span></div>
  <div class="field"><label for="topic">Topic</label>
    <select id="topic" name="topic" required>
      <option value="">Choose a topic</option><option>General question</option><option>Report a problem</option>
      <option>Feedback</option><option>Partnership</option></select>
    <span class="error" aria-live="polite"></span></div>
  <div class="field"><label for="message">Message</label>
    <textarea id="message" name="message" rows="5" required minlength="20" maxlength="500"></textarea>
    <span class="hint"><span id="count">0</span>/500 characters</span>
    <span class="error" aria-live="polite"></span></div>
  <input class="hp" type="text" name="website" tabindex="-1" autocomplete="off" aria-hidden="true">
  <button type="submit">Send</button>
  <p class="status" role="status"></p>
</form></div></section>
<section><h2>Find Us</h2><div id="map" role="img" aria-label="Map showing our location"></div></section>
