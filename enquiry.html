<main id="main"><section><h2>Tutorial Enquiry</h2>
<div class="form-wrap">
<form action="https://formspree.io/f/your-form-id" method="POST" data-ajax novalidate>
  <div class="field"><label for="name">Full name</label>
    <input id="name" name="name" type="text" required minlength="2" maxlength="50" autocomplete="name">
    <span class="error" aria-live="polite"></span></div>
  <div class="field"><label for="email">Email</label>
    <input id="email" name="email" type="email" required autocomplete="email">
    <span class="error" aria-live="polite"></span></div>
  <div class="field"><label for="phone">Phone</label>
    <input id="phone" name="phone" type="tel" required inputmode="tel" placeholder="082 123 4567" autocomplete="tel">
    <span class="error" aria-live="polite"></span></div>
  <div class="field"><label for="subject">Subject area</label>
    <select id="subject" name="subject" required>
      <option value="">Choose a subject</option><option>Chemistry</option><option>Information Technology</option>
      <option>Engineering</option><option>Science &amp; Robotics</option><option>Other</option></select>
    <span class="error" aria-live="polite"></span></div>
  <div class="field"><label for="date">Date you need it by</label>
    <input id="date" name="date" type="date" required>
    <span class="error" aria-live="polite"></span></div>
  <div class="field"><label for="message">Describe what you need</label>
    <textarea id="message" name="message" rows="5" required minlength="20" maxlength="500"></textarea>
    <span class="hint"><span id="count">0</span>/500 characters</span>
    <span class="error" aria-live="polite"></span></div>
  <div class="field check"><input id="consent" name="consent" type="checkbox" required>
    <label for="consent">I agree to be contacted about this enquiry.</label>
    <span class="error" aria-live="polite"></span></div>
  <input class="hp" type="text" name="website" tabindex="-1" autocomplete="off" aria-hidden="true">
  <button type="submit">Send</button>
  <p class="status" role="status"></p>
</form></div></section></main>

<script src="js/main.js" defer></script><script src="js/forms.js" defer></script></body></html>
